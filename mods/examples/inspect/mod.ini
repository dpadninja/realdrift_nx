# A research aid: logs the name and the current values of chosen fields of live objects, on
# every scene change and every 10 seconds. The name is what patch.ini's "@ filter" matches. Fields of a class are in the dump (il2cpp_find class X), but
# their values only exist in the running game. MIT (see LICENSE).
id = inspect
name = Field inspector
version = 1.0
api = 1
# the class, like a patch.ini section (another useful one: Assembly-CSharp:CarController with
# fields = TCS:bool ESP:bool ABS:bool TCSAllowedSlip:float ESPStrength:float ABSAllowedSlip:float)
class = Assembly-CSharp:Drivetrain
# fields to log, each name:type with type float, int or bool (types from il2cpp_find class):
# what cars.ini's power / torque / turbo keys build on
fields = maxPower:float maxTorque:float powerMultiplier:float externalMultiplier:float originalMaxPower:float turboCharged:bool maxTurboPressure:float shiftTime:float
# how many objects of the class to log (up to 8)
objects = 4
