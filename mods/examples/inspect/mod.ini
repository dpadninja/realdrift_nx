# A research aid: logs the current values of chosen fields of live objects, on every scene
# change and every 10 seconds. Fields of a class are in the dump (il2cpp_find class X), but
# their values only exist in the running game. MIT (see LICENSE).
id = inspect
name = Field inspector
version = 1.0
api = 1
# the class, like a patch.ini section
class = Assembly-CSharp:Drivetrain
# fields to log, each name:type with type float, int or bool (types from il2cpp_find class)
fields = limiterRPM:float maxRPM:float maxPower:float gear:int
# how many objects of the class to log (all cars of a race are objects of Drivetrain)
objects = 2
