# Car characteristics by car name. Car names: uv run python -m tools.mod_assets cars
# Keys: docs/MODDING_GUIDE.md "cars.ini keys", or any field of the car's components
# (Drivetrain.maxRPM, Wheel.gripMaterial). MIT (see LICENSE).
#
# The numbers below are examples, not the cars' real values. The lines starting with "#" are
# keys whose scale the game decides (no unit known yet): before setting one, enable the line
# with a guess, start a race and read the original in debug.log
# ("[mods] cars: cars.ini:<line>: susp_height of <prefab>: <original> -> <yours>"; base values
# only -- for the others use the inspect example), then pick yours.

# every car: traction control off
[*]
tcs = 0

# the Skyline with every cars.ini key
[Skyline]
# -- engine: at once, while driving --
power = 450              # hp at the peak (after the player's engine tuning)
# torque = 520           # Nm at the peak: the same lever as power, give one of the two
turbo = 1                # 0 / 1
turbo_bar = 1.2          # bar
rev_limit = 8000         # rpm
max_rpm = 8500           # rpm
idle_rpm = 900           # rpm
# -- drivetrain: at once --
drive = AWD              # RWD FWD AWD XWD
final_ratio = 3.9
gear_1 = 3.6             # from the next shift
gear_2 = 2.1
gear_3 = 1.5
gear_4 = 1.15
gear_5 = 0.95
gear_6 = 0.8
# -- brakes, per wheel: at once --
# brake_torque = 1500    # Nm
# handbrake_torque = 2500  # Nm
# -- assists: at once --
tcs = 0                  # wins over [*] above
# tcs_slip = 0.2
esp = 1
esp_strength = 0.3
abs = 1
# abs_slip = 0.2
# -- base values: when the car is next built (garage, race start), under the player's tuning --
weight = 1250            # kg, before weight reduction
shift_time = 0.2         # s, before shift-time tuning
steering_angle = 40      # degrees
# susp_height = 0.1
# front_camber = -2
# rear_camber = -1
# weight_distr = 0.55
# front_grip = 1.0
# front_side_grip = 1.0
# rear_grip = 1.0
# rear_side_grip = 1.0

# the E30 M3: only a few values, plus a field without a key of its own
[E30M]
weight = 1100
shift_time = 0.15
rev_limit = 8500
Drivetrain.maxPowerRPM = 8200
