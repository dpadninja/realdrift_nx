# Car characteristics by car name: every cars.ini key for one car. MIT (see LICENSE).
#   car names:          uv run python -m tools.mod_assets cars
#   a car's curve:      uv run python -m tools.mod_assets curves E30M
#   every key:          uv run python -m tools.mod_ini keys   (and docs/MODDING_GUIDE.md)
#
# The numbers are examples, not the car's values, except the torque curve (the E30M's own,
# with more torque on top). The lines starting with "#" are keys whose scale only the game
# knows: on the console debug.log shows the car's own value at the first write
# ("[mods] cars: cars.ini:<line>: front_spring of E30M_Garage(Clone): <car's> -> <yours>"),
# so enable one with its current value first, read the log, then change it.

# every car: traction control off
[*]
tcs = 0

[E30M]
# -- engine --
torque_curve = 0:0 251:73.7 731:114.4 1289:144.3 2099:194.5 2833:215.9 3392:227.9 3882:234.5 4500:250 5000:250 5526:243 5975:231 6539:204 7005:135 7503:-1.7
power = 197              # hp at the peak: scales the whole curve (the player's tuning adds on top)
turbo = 0
turbo_bar = 0.8          # bar, used when turbo = 1
rev_limit = 7400         # where the revs stop
max_rpm = 7500           # not a cut: engine friction grows with rpm / max_rpm
idle_rpm = 900
# -- drivetrain --
drive = RWD
shift_time = 0.2
final_ratio = 3.9
gear_1 = 3.83
gear_2 = 2.2
gear_3 = 1.4
gear_4 = 1.0
gear_5 = 0.81
gear_6 = 0.7
rear_diff = two_way_LSD  # open viscous locked one_way_LSD two_way_LSD one_point_five_way_LSD
front_diff = open
