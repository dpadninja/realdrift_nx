# Checks every push and pull request: Python lint, all tests with line coverage (fails below
# the floors in the Makefile), documentation rules (part of the tests), and the Switch build
# with warnings as errors. No game files are involved; tests that need them are skipped.
# MIT (see LICENSE).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Host packages
        run: sudo apt-get install -y --no-install-recommends zlib1g-dev
      - name: Lint (ruff, mypy)
        run: make lint
      - name: Tests with coverage
        run: make coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: build-host/coverage/
          if-no-files-found: ignore

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build realdrift_nx.nro
        run: make
