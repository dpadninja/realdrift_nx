[project]
name = "ndrift"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyelftools>=0.33",
    "unitypy>=1.25.4",
]

[dependency-groups]
dev = [
    "gcovr>=8.7",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# docs/PYTHON_STYLE.md
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.per-file-target-version]
"tools/stage_sd.py" = "py38"   # ships to players: stdlib only, Python 3.8+

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D", "N", "RUF", "PTH", "C4"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test docstring is one paragraph describing the case and why it matters, not a command
# with a one-line summary.
"tests/*" = ["D401", "D205"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["tools"]

[[tool.mypy.overrides]]
module = ["elftools.*", "UnityPy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tools"]
